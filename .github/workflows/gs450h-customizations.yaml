# upstream 追従で GS 450h 改造が黙って落ちていないかを検出する。
# 何を・なぜ見るかは openpilot/sunnypilot/tests/test_gs450h_customizations.py の docstring。
# ⚠ ast でソースを読むだけなので submodule も scons も要らない。重くしないこと。
# ⚠⚠ `.github/` は upstream の staging-chestnut に無いので、追従のたびに載せ直しが要る。

name: GS 450h customizations

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gs450h-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customizations:
    name: 改造が落ちていないか
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # ソースを読むだけなので不要

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --disable-pip-version-check pytest

      # ⚠ 追従ブランチ名は毎回変わる (gs450h-follow-YYYYMMDD) ので branches は '**'。
      #   テストがまだ載っていない古いブランチに push したときは hashFiles が空 = skipped。
      # ⚠ --noconftest は必須。openpilot の conftest.py は cereal など重い依存を import するので、
      #   付けないと collection の時点で落ちる。
      - name: pytest
        if: hashFiles('openpilot/sunnypilot/tests/test_gs450h_customizations.py') != ''
        run: |
          python -m pytest openpilot/sunnypilot/tests/test_gs450h_customizations.py \
            -q --noconftest --no-header
